global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:

  # 4. .NET Smart Inventory API
  - job_name: 'smartinventory-api'
    static_configs:
      - targets: ['smartinventory-api:8080']
    metrics_path: /metrics

  # 7. Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
  
  # 8. Grafana self-monitoring
  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']
    metrics_path: /metrics

  # 9. Loki self-monitoring
  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']
    metrics_path: /metrics
  

# Alerting rules   
rule_files:
  - '/etc/prometheus/alerts.yml'