name: smartinventory
networks:
  smartinventory_network:
    external: true
    name: smartinventory_network

services:

  smartinventory-api:
    image: smartinventory-api:1.0
    env_file:
      - .env
    environment:
      - DOTNET_SYSTEM_NET_DISABLEIPV6=1
    ports:
      - "8080:8080"
    networks:
      - smartinventory_network
